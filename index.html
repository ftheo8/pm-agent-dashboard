<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAGO · IA de Gerenciamento Operacional</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --blue: #2a78d6;
    --aqua: #1baf7a;
    --yellow: #eda100;
    --green: #008300;
    --violet: #4a3aa7;
    --red: #e34948;
    --good: #0ca30c;
    --accent: var(--blue);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --blue: #3987e5;
      --aqua: #199e70;
      --yellow: #c98500;
      --green: #008300;
      --violet: #9085e9;
      --red: #e66767;
      --good: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--grid);
    position: sticky; top: 0; background: var(--page); z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 400; }
  nav { display: flex; gap: 4px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  nav button {
    border: 0; background: transparent; color: var(--ink-2); font: inherit;
    padding: 6px 14px; border-radius: 8px; cursor: pointer;
  }
  nav button.active { background: var(--accent); color: #fff; }
  nav button:not(.active):hover { background: var(--grid); }
  .btn {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--ink);
    font: inherit; padding: 6px 14px; border-radius: 9px; cursor: pointer;
  }
  .btn:hover { background: var(--grid); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .btn.small { padding: 3px 10px; font-size: 12px; border-radius: 7px; }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
  #meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { padding: 20px; }

  .board { display: flex; gap: 14px; overflow-x: auto; align-items: flex-start; padding-bottom: 12px; }
  .col { min-width: 260px; width: 260px; flex: none; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .col-head b { font-size: 13px; font-weight: 600; }
  .col-head .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .col-body { display: flex; flex-direction: column; gap: 10px; min-height: 60px; border-radius: 12px; }
  .col-body.dragover { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .card.dragging { opacity: .45; }
  .card.drop-above { box-shadow: 0 -3px 0 0 var(--accent); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .prazo-chip { color: var(--ink-2); }
  .prazo-chip.overdue { color: var(--red); font-weight: 600; }
  .clip { color: var(--muted); }
  .progress { height: 4px; background: var(--grid); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
  .arch-badge { font-size: 10px; font-weight: 700; letter-spacing: .4px; color: var(--muted); border: 1px solid var(--grid); border-radius: 5px; padding: 1px 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .bigcard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; cursor: pointer; }
  .bigcard h3 { margin: 0; font-size: 15px; }
  .bigcard .top { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; margin-bottom: 8px; }
  .status-chip {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
    color: #fff; white-space: nowrap; flex: none;
  }
  .steps { margin: 10px 0 0; padding: 0; list-style: none; }
  .steps li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; color: var(--ink-2); }
  .steps input[type=checkbox] { margin-top: 3px; accent-color: var(--good); cursor: pointer; }
  .steps li.done > span { color: var(--muted); text-decoration: line-through; }
  .notas { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; white-space: pre-wrap; }

  .agenda-wrap { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .agenda-wrap { grid-template-columns: 1fr; } }
  .cal { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-size: 15px; text-transform: capitalize; }
  .cal-head button { border: 1px solid var(--border); background: transparent; color: var(--ink); border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; }
  .cal-head button:hover { background: var(--grid); }
  .cal-month-events { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  .month-ev { font-size: 12px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--yellow) 14%, var(--surface-1)); border: 1px solid color-mix(in srgb, var(--yellow) 40%, transparent); }
  .cal table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal th { color: var(--muted); font-weight: 500; font-size: 11px; padding: 4px; text-transform: uppercase; }
  .cal td { border: 1px solid var(--grid); height: 74px; vertical-align: top; padding: 4px 6px; font-size: 12px; }
  .cal td .d { color: var(--muted); }
  .cal td.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal td.today .d { color: var(--accent); font-weight: 700; }
  .cal td.other { background: color-mix(in srgb, var(--page) 60%, var(--surface-1)); }
  .cal-ev { margin-top: 3px; padding: 2px 6px; border-radius: 6px; color: #fff; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .upcoming { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .upcoming h3 { margin: 0 0 10px; font-size: 14px; }
  .up-item { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--grid); align-items: baseline; }
  .up-item:first-of-type { border-top: 0; }
  .up-date { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; white-space: nowrap; min-width: 80px; }
  .up-none { color: var(--muted); }

  .gantt-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; overflow-x: auto; }
  .gantt-note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg .rowlabel { fill: var(--ink); font-size: 12.5px; font-weight: 550; }
  svg .rowsub { fill: var(--muted); font-size: 10.5px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  /* ---------- modal ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
    display: none; align-items: flex-start; justify-content: center; padding: 4vh 16px;
  }
  #overlay.open { display: flex; }
  #modal {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    width: 640px; max-width: 100%; max-height: 92vh; overflow-y: auto; padding: 22px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  #modal h2 { margin: 0 0 4px; font-size: 17px; }
  .m-close { float: right; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .m-close:hover { color: var(--ink); }
  .m-sec { margin-top: 18px; }
  .m-sec > h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .m-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .m-row label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  input[type=text], input[type=date], input[type=month], input[type=datetime-local], input[type=number], select, textarea {
    font: inherit; color: var(--ink); background: var(--page);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  }
  textarea { width: 100%; min-height: 84px; resize: vertical; }
  .field { flex: 1; min-width: 130px; }
  .field input, .field select { width: 100%; }
  .m-list { list-style: none; margin: 0; padding: 0; }
  .m-list li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
  .m-list li:last-child { border-bottom: 0; }
  .m-list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .m-list .dim { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 6px; }
  .icon-btn:hover { color: var(--red); background: var(--grid); }
  .att-link { color: var(--accent); cursor: pointer; text-decoration: none; }
  .att-link:hover { text-decoration: underline; }
  .m-footer { display: flex; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--grid); flex-wrap: wrap; }
  .m-footer .spacer { flex: 1; }
  .muted-note { color: var(--muted); font-size: 12px; }

  /* ---------- campos de data com calendário ---------- */
  .datewrap { display: flex; align-items: stretch; gap: 0; }
  .datewrap input { flex: 1; min-width: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: 0; }
  .datewrap input::-webkit-calendar-picker-indicator { display: none; }
  .cal-btn {
    border: 1px solid var(--border); background: var(--page); color: var(--muted);
    border-top-right-radius: 8px; border-bottom-right-radius: 8px; cursor: pointer;
    padding: 0 9px; font-size: 14px; line-height: 1;
  }
  .cal-btn:hover { background: var(--grid); color: var(--ink); }

  /* ---------- visualizador de anexos ---------- */
  #viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 70;
    display: none; flex-direction: column;
  }
  #viewer.open { display: flex; }
  #v-bar { display: flex; gap: 12px; align-items: center; padding: 12px 18px; color: #fff; }
  #v-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #v-bar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
  #v-bar .btn:hover { background: rgba(255,255,255,.22); }
  #v-body { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 0 18px 18px; min-height: 0; }
  #v-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
  #v-body iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; }
  #v-body video { max-width: 100%; max-height: 100%; border-radius: 10px; }
  #v-body pre {
    max-width: 100%; max-height: 100%; overflow: auto; margin: 0;
    background: var(--surface-1); color: var(--ink); border-radius: 10px; padding: 16px 20px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  }
  #v-body .v-fallback { color: #fff; text-align: center; }
  #v-loading { color: rgba(255,255,255,.7); }

  /* ---------- filtros ---------- */
  #filters {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 20px; border-bottom: 1px solid var(--grid); background: var(--page);
  }
  #filters input, #filters select { padding: 5px 9px; font-size: 13px; }
  #filters input[type=search] { min-width: 160px; flex: 1; max-width: 260px; }
  #filters select { max-width: 170px; }
  #f-clear { display: none; }
  #f-clear.on { display: inline-block; }

  .tagchip {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 14%, var(--surface-1));
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    white-space: nowrap;
  }
  .tagchip.proj {
    background: color-mix(in srgb, var(--violet) 14%, var(--surface-1));
    color: var(--violet); border-color: color-mix(in srgb, var(--violet) 35%, transparent);
  }

  /* ---------- chat ---------- */
  #chat {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; z-index: 60;
    background: var(--surface-1); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; transform: translateX(105%); transition: transform .22s ease;
    box-shadow: -12px 0 40px rgba(0,0,0,.25);
  }
  #chat.open { transform: translateX(0); }
  #c-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--grid); }
  #c-head b { flex: 1; }
  #c-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--page); border: 1px solid var(--grid); border-bottom-left-radius: 4px; }
  .bubble .when { display: block; font-size: 10px; opacity: .55; margin-top: 4px; }
  #c-typing { align-self: flex-start; color: var(--muted); font-size: 12px; padding: 0 4px; display: none; }
  #c-typing.on { display: block; }
  #c-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--grid); }
  #c-text { flex: 1; resize: none; min-height: 40px; max-height: 120px; }

  /* ================= aba e-mail ================= */
  .em-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 980px; margin: 0 auto; }
  .em-status { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; border: 1px solid var(--grid); border-radius: 12px; background: var(--page); font-size: 13px; }
  .em-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .em-dot.on { background: var(--good); } .em-dot.off { background: var(--red); }
  .em-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .em-routine { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .em-routine input[type=text] { width: 130px; }
  .em-group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .em-item { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; border: 1px solid var(--grid); border-left: 4px solid var(--muted); border-radius: 10px; background: var(--page); margin-bottom: 8px; }
  .em-item.agora { border-left-color: var(--red); }
  .em-item.atencao { border-left-color: var(--yellow); }
  .em-item .em-sub { font-weight: 600; font-size: 13.5px; }
  .em-item .em-meta { color: var(--muted); font-size: 12px; }
  .em-item .em-sum { font-size: 13px; }
  .em-item a { color: var(--accent); font-size: 12.5px; text-decoration: none; }
  .em-item a:hover { text-decoration: underline; }
  .em-out { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; background: var(--page); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; max-height: 420px; overflow-y: auto; }
  .em-out a { color: var(--accent); }
  .em-note { color: var(--muted); font-size: 12.5px; }
  .em-sub a { color: var(--ink); text-decoration: none; }
  .em-sub a:hover { color: var(--accent); text-decoration: underline; }
  #em-view { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; align-items: center; justify-content: center; padding: 20px; }
  #em-view.open { display: flex; }
  #em-view-box { background: var(--page); border: 1px solid var(--grid); border-radius: 14px; width: min(780px, 100%); max-height: 84vh; display: flex; flex-direction: column; overflow: hidden; }
  #em-view-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--grid); }
  #em-view-bar b { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #em-view-bar a { color: var(--accent); font-size: 12.5px; text-decoration: none; flex: none; }
  #em-view-body { padding: 14px 16px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  #em-view-body a { color: var(--accent); }
  .em-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .em-acts .btn { font-size: 11.5px; padding: 2px 8px; }
  .em-item.pend { opacity: .65; }
  .em-pend { font-size: 12px; color: var(--yellow); align-self: center; }

  /* ================= quick-done + plataforma de projetos ================= */
  .card { position: relative; }
  .qdone {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
    border-radius: 50%; border: 1.5px solid var(--baseline); background: transparent;
    color: transparent; font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
  }
  .qdone:hover { border-color: var(--good); color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .qdone.qd-inline { position: static; flex: none; }
  .card h3 { padding-right: 26px; }
  .tagchip.pnode { background: color-mix(in srgb, var(--violet) 18%, transparent); cursor: pointer; }

  .pj-wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .pj-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pj-head h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; }
  .pj-crumbs { font-size: 12.5px; color: var(--muted); }
  .pj-crumbs a { color: var(--accent); text-decoration: none; }
  .pj-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: 1px dashed var(--baseline); border-radius: 10px; }
  .pj-form input[type=text] { flex: 1; min-width: 180px; }
  .pj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .pj-card { border: 1px solid var(--grid); border-radius: 12px; background: var(--page); padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .pj-card:hover { border-color: var(--accent); }
  .pj-top { display: flex; align-items: center; gap: 8px; }
  .pj-top h3 { margin: 0; font-size: 14px; flex: 1; min-width: 0; }
  .pj-badge { font-size: 10.5px; color: #fff; border-radius: 999px; padding: 2px 8px; flex: none; }
  .pj-bar { height: 6px; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .pj-bar i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
  .pj-bar.big { height: 10px; }
  .pj-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .pj-stat { border: 1px solid var(--grid); border-radius: 10px; padding: 8px 14px; text-align: center; background: var(--page); }
  .pj-stat b { display: block; font-size: 16px; }
  .pj-stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .pj-stat.late b { color: var(--red); }
  .pj-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .pj-tasks { display: flex; flex-direction: column; gap: 6px; }
  .pj-task { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--grid); border-radius: 9px; background: var(--page); font-size: 13px; flex-wrap: wrap; }
  .pj-task a { color: var(--ink); text-decoration: none; flex: 1; min-width: 140px; }
  .pj-task a:hover { color: var(--accent); }
  .pj-task.done a { color: var(--muted); text-decoration: line-through; }
  .pj-ok { color: var(--good); width: 22px; text-align: center; flex: none; }
  .pj-node { font-size: 11px; color: var(--violet); border: 1px solid color-mix(in srgb, var(--violet) 40%, transparent); border-radius: 999px; padding: 1px 7px; }
  .pj-status-sel { max-width: 120px; }

  /* ================= aba hoje ================= */
  #subnav button { padding: 4px 12px; font-size: 12.5px; }
  .home-wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .home-head .em-note { margin-left: auto; }
  .home-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .h-card { border: 1px solid var(--grid); border-radius: 12px; background: var(--page); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .h-card h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

  @media (max-width: 900px) { .h-c1, .h-c2, .h-c3 { grid-column: 1 / -1; } }
  .h-list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }

  .h-gcal { border: 1px dashed var(--baseline); border-radius: 10px; padding: 8px 10px; color: var(--muted); font-size: 12px; }

  /* ===== IAGO: marca, login, settings, participantes, log, modo privado ===== */
  #brand, .brandbox { display: flex; align-items: center; gap: 9px; }

  #pvt-badge { display: none; background: #b3123f; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
  body.pvt #pvt-badge { display: inline-block; }
  body.pvt header { background: color-mix(in srgb, #b3123f 12%, var(--surface-1)); border-bottom: 2px solid #b3123f; }
  body.pvt { --accent: #b3123f; }
  body.pvt #btn-pvt { background: #b3123f; color: #fff; border-color: #b3123f; }

  #login { position: fixed; inset: 0; z-index: 200; background: var(--page); display: none; align-items: center; justify-content: center; }
  #login.on { display: flex; }
  #login-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 28px 26px; width: min(92vw, 360px); display: flex; flex-direction: column; gap: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  #login-card .brandbox { margin-bottom: 14px; }

  #login-card input { padding: 9px 10px; border: 1px solid var(--baseline); border-radius: 9px; background: var(--page); color: var(--ink); font: inherit; }
  #login-card button { margin-top: 14px; padding: 10px; }

  .avatar.me { width: 26px; height: 26px; font-size: 12px; margin-left: 0; vertical-align: middle; }
  .as-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--baseline); border-radius: 999px; padding: 4px 10px; margin: 2px 4px 2px 0; font-size: 12.5px; cursor: pointer; }

</style>

<script>
const $ = (s, el = document) => el.querySelector(s);
const API = 'https://iucqufccyboilasswnun.supabase.co/functions/v1/dashboard';
// A chave nunca vai na URL das chamadas de API (fica fora de logs e histórico);
// viaja no header x-pm-key. Aceita ?key= só p/ bootstrap e limpa a barra na hora.
let KEY = new URLSearchParams(location.search).get('key') || localStorage.getItem('pm_key') || '';
if (new URLSearchParams(location.search).get('key')) {
  localStorage.setItem('pm_key', KEY);
  history.replaceState(null, '', location.pathname); // tira a chave da URL
}
// Sessão IAGO (login por usuário/senha). A chave antiga (pm_key) segue valendo como admin.
let TOKEN = localStorage.getItem('iago_token') || '';
let ME = null;
try { ME = JSON.parse(localStorage.getItem('iago_user') || 'null'); } catch { ME = null; }
let USERS = [];      // usuários ativos (pra atribuir tarefas e mostrar avatares)
let PVT = false;     // modo privado (só tarefas private=true do próprio usuário)
const isAdm = () => (ME?.role ?? (KEY ? 'admin' : '')) === 'admin';

function authHeaders() {
  const h = {};
  if (TOKEN) h['x-iago-token'] = TOKEN;
  else if (KEY) h['x-pm-key'] = KEY;
  if (PVT) h['x-pm-pvt'] = '1';
  return h;
}
function showLogin() { $('#login').classList.add('on'); setTimeout(() => $('#lg-user')?.focus(), 50); }
function logout() {
  if (TOKEN) fetch(`${API}/api/auth/logout`, { method: 'POST', headers: { 'x-iago-token': TOKEN } }).catch(() => {});
  localStorage.removeItem('iago_token'); localStorage.removeItem('iago_user'); localStorage.removeItem('pm_key');
  sessionStorage.removeItem('iago_pvt_ok');
  location.reload();
}
function applyRole() {
  const adm = isAdm();
  const el = (s) => document.querySelector(s);
  el('#nav [data-tab="email"]').style.display = adm ? '' : 'none';
  el('#subnav [data-view="projetos"]').style.display = adm ? '' : 'none';
  el('#btn-pvt').style.display = ''; // modo privado é de todos (cada um vê só as suas)
  el('#user-chip') && (el('#user-chip').textContent = ME ? ME.name || ME.username : '');
}
let TASKS = [];
let PROJECTS = [];    // entidade Projeto (hierarquia própria; tarefas vinculam por project_id)
let PROJ_OPEN = null; // id do projeto aberto na página ampla
let TAB = 'hoje';     // hoje | projetos | email
let VIEW = 'kanban';  // subview da aba projetos
let SHOW_ARCH = false;
let MODAL_SLUG = null; // slug aberto no modal; '' = criando novo
let DRAGGING = false;
let CAL = (() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() }; })();

const STATUS = [
  { key: 'a fazer',             color: 'var(--violet)' },
  { key: 'em andamento',        color: 'var(--blue)' },
  { key: 'a verificar',         color: 'var(--yellow)' },
  { key: 'aguardando detalhes', color: 'var(--aqua)' },
  { key: 'concluído',           color: 'var(--good)' },
  { key: 'mesclado',            color: 'var(--muted)' },
];
const statusColor = (s) => (STATUS.find((x) => x.key === s) || { color: 'var(--muted)' }).color;

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtDate = (iso) => { const [y, m, d] = iso.split('-'); return `${Number(d)}/${MESES[Number(m) - 1]}`; };
const fmtDateTime = (iso) => new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const todayISO = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

function prazoChip(t) {
  if (t.prazo.date) {
    const over = t.prazo.date < todayISO() && !['concluído', 'mesclado'].includes(t.status);
    return `<span class="prazo-chip ${over ? 'overdue' : ''}">⏱ ${fmtDate(t.prazo.date)}${over ? ' (atrasado)' : ''}</span>`;
  }
  if (t.prazo.month) { const [y, m] = t.prazo.month.split('-'); return `<span class="prazo-chip">⏱ ${MESES[Number(m) - 1]}/${y}</span>`; }
  if (t.prazo.raw) return `<span class="prazo-chip">⏱ ${esc(t.prazo.raw)}</span>`;
  return `<span class="prazo-chip" style="color:var(--muted)">sem prazo</span>`;
}
const progress = (t) => {
  const total = t.steps.length, done = t.steps.filter((s) => s.done).length;
  return { total, done, pct: total ? Math.round((100 * done) / total) : 0 };
};
const FILTERS = { q: '', empresa: '', projeto: '', status: '', prazo: '' };

function matchesFilters(t) {
  if (!SHOW_ARCH && t.archived) return false;
  if (FILTERS.empresa && t.empresa !== FILTERS.empresa) return false;
  if (FILTERS.projeto && t.projeto !== FILTERS.projeto) return false;
  if (FILTERS.status && t.status !== FILTERS.status) return false;
  if (FILTERS.prazo) {
    const today = todayISO();
    const in7 = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
    const in30 = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
    const d = t.prazo.date;
    const closed = ['concluído', 'mesclado'].includes(t.status);
    if (FILTERS.prazo === 'atrasado' && !(d && d < today && !closed)) return false;
    if (FILTERS.prazo === '7d' && !(d && d >= today && d <= in7)) return false;
    if (FILTERS.prazo === '30d' && !(d && d >= today && d <= in30)) return false;
    if (FILTERS.prazo === 'sem' && (d || t.prazo.month || t.prazo.raw)) return false;
  }
  if (FILTERS.q) {
    const q = FILTERS.q.toLowerCase();
    const hay = [t.title, t.notas, t.empresa, t.projeto, ...t.steps.map((s) => s.label)].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const visible = () => TASKS.filter(matchesFilters);
const bySlug = (slug) => TASKS.find((t) => t.id === slug);
const distinct = (field) => [...new Set(TASKS.map((t) => t[field]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));

function renderFilters() {
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  $('#f-empresa').innerHTML = opt('', 'empresa: todas', FILTERS.empresa) + distinct('empresa').map((e) => opt(e, e, FILTERS.empresa)).join('');
  $('#f-projeto').innerHTML = opt('', 'assunto: todos', FILTERS.projeto) + distinct('projeto').map((p) => opt(p, p, FILTERS.projeto)).join('');
  const sts = [...new Set(TASKS.map((t) => t.status))];
  $('#f-status').innerHTML = opt('', 'status: todos', FILTERS.status) + STATUS.filter((s) => sts.includes(s.key)).map((s) => opt(s.key, s.key, FILTERS.status)).join('');
  $('#f-clear').classList.toggle('on', Boolean(FILTERS.q || FILTERS.empresa || FILTERS.projeto || FILTERS.status || FILTERS.prazo));
}

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
  if (res.status === 401) {
    localStorage.removeItem('pm_key'); localStorage.removeItem('iago_token'); localStorage.removeItem('iago_user');
    KEY = ''; TOKEN = ''; ME = null;
    showLogin();
    throw new Error('sessao expirada');
  }
  const body = await res.json();
  if (!res.ok) { alert(body.error || 'erro na API'); throw new Error(body.error || 'api'); }
  return body;
}
const post = (path, obj) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });

async function load() {
  const [tasks, projects, users] = await Promise.all([
    api('/api/tasks'),
    api('/api/projects').catch(() => PROJECTS),
    api('/api/users').catch(() => USERS),
  ]);
  TASKS = tasks;
  PROJECTS = projects || [];
  USERS = (users || []).filter((u) => u.active !== false);
  if (ME) { const self = USERS.find((u) => u.id === ME.id); if (self && self.avatar !== undefined) ME.avatar = self.avatar; }
  TASKS.sort((a, b) => a.title.localeCompare(b.title, 'pt'));
  $('#meta').textContent = `${visible().length} projetos · atualizado ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
  renderFilters();
  render();
  if (MODAL_SLUG) renderModal(MODAL_SLUG); // mantém o modal em dia
}

function render() {
  const main = $('#main');
  const proj = TAB === 'projetos';
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === TAB));
  document.querySelectorAll('#subnav button').forEach((b) => b.classList.toggle('active', b.dataset.view === VIEW));
  $('#subnav').style.display = proj ? '' : 'none';
  $('#filters').style.display = proj ? '' : 'none';
  $('#btn-new').style.display = proj ? '' : 'none';
  $('#show-arch').closest('label').style.display = proj ? '' : 'none';
  if (TAB === 'hoje') { renderHome(main); return; }
  if (TAB === 'email') { renderEmail(main); return; }
  if (VIEW === 'projetos') { renderProjetos(main); return; }
  if (!visible().length) { main.innerHTML = '<div class="empty">Nenhum projeto por aqui.</div>'; return; }
  if (VIEW === 'kanban') renderKanban(main);
  else if (VIEW === 'cards') renderCards(main);
  else if (VIEW === 'agenda') renderAgenda(main);
  else renderGantt(main);
}

function bindCardClicks(main) {
  main.querySelectorAll('[data-open]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (DRAGGING) return;
      if (e.target.closest('input,button,a,select')) return;
      openModal(el.dataset.open);
    });
  });
}

/* ================= kanban ================= */
const kanbanSort = (a, b) => ((a.kanban_pos ?? 1e9) - (b.kanban_pos ?? 1e9)) || a.title.localeCompare(b.title, 'pt');

function renderKanban(main) {
  const items0 = visible();
  const known = STATUS.map((s) => s.key);
  const extras = [...new Set(items0.map((t) => t.status))].filter((s) => !known.includes(s));
  const cols = [...STATUS.map((s) => s.key), ...extras];
  main.innerHTML = `<div class="board">` + cols.map((st) => {
    const items = items0.filter((t) => t.status === st).sort(kanbanSort);
    if (!items.length && !['em andamento', 'a verificar', 'aguardando detalhes', 'concluído'].includes(st)) return '';
    return `<div class="col">
      <div class="col-head"><span class="dot" style="background:${statusColor(st)}"></span><b>${st}</b><span class="count">${items.length}</span></div>
      <div class="col-body" data-status="${st}">${items.map(cardHTML).join('')}</div>
    </div>`;
  }).join('') + `</div>`;

  main.querySelectorAll('.card').forEach((el) => {
    el.draggable = true;
    el.addEventListener('dragstart', (e) => { DRAGGING = true; e.dataTransfer.setData('text/plain', el.dataset.open); el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); setTimeout(() => { DRAGGING = false; }, 50); });
  });
  // card que fica logo ABAIXO do cursor (pra soltar antes dele; null = fim da coluna)
  const afterEl = (col, y) => [...col.querySelectorAll('.card:not(.dragging)')]
    .find((c) => y < c.getBoundingClientRect().top + c.getBoundingClientRect().height / 2) || null;
  main.querySelectorAll('.col-body').forEach((col) => {
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      col.classList.add('dragover');
      col.querySelectorAll('.drop-above').forEach((c) => c.classList.remove('drop-above'));
      const after = afterEl(col, e.clientY);
      if (after) after.classList.add('drop-above');
    });
    col.addEventListener('dragleave', () => { col.classList.remove('dragover'); col.querySelectorAll('.drop-above').forEach((c) => c.classList.remove('drop-above')); });
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('dragover');
      col.querySelectorAll('.drop-above').forEach((c) => c.classList.remove('drop-above'));
      const slug = e.dataTransfer.getData('text/plain');
      const t = bySlug(slug);
      if (!t) return;
      const after = afterEl(col, e.clientY);
      // ordem final da coluna: todos menos o arrastado, com ele inserido na posição do drop
      const order = [...col.querySelectorAll('.card')].map((c) => c.dataset.open).filter((s) => s !== slug);
      order.splice(after ? order.indexOf(after.dataset.open) : order.length, 0, slug);
      const newStatus = col.dataset.status;
      const oldStatus = t.status;
      // otimista: reflete já na tela, salva em seguida
      t.status = newStatus;
      order.forEach((s, i) => { const x = bySlug(s); if (x) x.kanban_pos = (i + 1) * 10; });
      render();
      if (newStatus !== oldStatus) await post('/api/task/update', { slug, status: newStatus });
      await post('/api/kanban/reorder', { slugs: order });
      load();
    });
  });
  bindCardClicks(main);
  bindQuickDone(main);
}

/* ================= agenda ================= */
function renderAgenda(main) {
  const items = visible().filter((t) => !t.archived);
  const { y, m } = CAL;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysIn = new Date(y, m + 1, 0).getDate();
  const monthKey = `${y}-${String(m + 1).padStart(2, '0')}`;
  const byDate = {};
  for (const t of items) if (t.prazo.date) (byDate[t.prazo.date] ??= []).push(t);
  const monthEvs = items.filter((t) => t.prazo.month === monthKey);
  const today = todayISO();

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const dnum = i - startDow + 1;
    if (dnum < 1 || dnum > daysIn) { cells += `<td class="other"></td>`; if (i % 7 === 6) cells += '</tr><tr>'; continue; }
    const iso = `${monthKey}-${String(dnum).padStart(2, '0')}`;
    const evs = (byDate[iso] || []).map((t) => `<div class="cal-ev" data-open="${t.id}" style="background:${statusColor(t.status)}" title="${esc(t.title)}">${esc(t.title)}</div>`).join('');
    cells += `<td class="${iso === today ? 'today' : ''}"><span class="d">${dnum}</span>${evs}</td>`;
    if (i % 7 === 6) cells += '</tr><tr>';
  }

  const dated = items.filter((t) => t.prazo.date && t.prazo.date >= today).sort((a, b) => a.prazo.date.localeCompare(b.prazo.date));
  const monthly = items.filter((t) => t.prazo.month && t.prazo.month >= today.slice(0, 7)).sort((a, b) => a.prazo.month.localeCompare(b.prazo.month));
  const noPrazo = items.filter((t) => !t.prazo.date && !t.prazo.month && !['concluído', 'mesclado'].includes(t.status));
  const alerts = items.flatMap((t) => t.alerts.filter((a) => !a.fired).map((a) => ({ ...a, task: t.title })))
    .sort((a, b) => a.fire_at.localeCompare(b.fire_at)).slice(0, 8);

  main.innerHTML = `<div class="agenda-wrap">
    <div class="cal">
      <div class="cal-head">
        <button id="prev">‹</button>
        <b>${first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</b>
        <button id="next">›</button>
      </div>
      <div class="cal-month-events">${monthEvs.map((t) => `<div class="month-ev">📌 <b>${esc(t.title)}</b> — prazo em ${MESES[m]}/${y} (sem data exata)</div>`).join('')}</div>
      <table><tr><th>dom</th><th>seg</th><th>ter</th><th>qua</th><th>qui</th><th>sex</th><th>sáb</th></tr><tr>${cells}</tr></table>
    </div>
    <div class="upcoming">
      <h3>Próximos prazos</h3>
      ${dated.map((t) => `<div class="up-item"><span class="up-date">${fmtDate(t.prazo.date)}</span><span>${esc(t.title)}</span></div>`).join('')}
      ${monthly.map((t) => { const [yy, mm] = t.prazo.month.split('-'); return `<div class="up-item"><span class="up-date">${MESES[Number(mm) - 1]}/${yy}</span><span>${esc(t.title)} <span style="color:var(--muted)">(mês)</span></span></div>`; }).join('')}
      ${!dated.length && !monthly.length ? '<div class="up-none">Nenhum prazo definido.</div>' : ''}
      ${alerts.length ? `<h3 style="margin-top:16px">Alertas agendados</h3>${alerts.map((a) => `<div class="up-item"><span class="up-date">${fmtDateTime(a.fire_at)}</span><span>⏰ ${esc(a.message)} <span style="color:var(--muted)">(${esc(a.task)})</span></span></div>`).join('')}` : ''}
      ${noPrazo.length ? `<h3 style="margin-top:16px">Sem prazo</h3>${noPrazo.map((t) => `<div class="up-item"><span class="up-date">—</span><span>${esc(t.title)}</span></div>`).join('')}` : ''}
    </div>
  </div>`;
  $('#prev').onclick = () => { CAL.m--; if (CAL.m < 0) { CAL.m = 11; CAL.y--; } render(); };
  $('#next').onclick = () => { CAL.m++; if (CAL.m > 11) { CAL.m = 0; CAL.y++; } render(); };
  bindCardClicks(main);
}

/* ================= gantt ================= */
function ganttHTML(rowsInput) {
  const rows = rowsInput.filter((t) => !['mesclado'].includes(t.status) && !t.archived);
  if (!rows.length) return '<div class="empty">Nada para mostrar no Gantt.</div>';
  const today = new Date(todayISO());
  const D = 86400000;
  const ends = rows.map((t) => {
    if (t.prazo.date) return new Date(t.prazo.date);
    if (t.prazo.month) { const [y, m] = t.prazo.month.split('-').map(Number); return new Date(y, m, 0); }
    return null;
  });
  const starts = rows.map((t) => new Date(t.start));
  let min = new Date(Math.min(...starts, today));
  let max = new Date(Math.max(...ends.filter(Boolean).map(Number), Number(today) + 21 * D));
  min = new Date(min.getFullYear(), min.getMonth(), 1);
  max = new Date(max.getFullYear(), max.getMonth() + 1, 1);

  const LEFT = 210, RW = 26, TOP = 34, W = LEFT + Math.max(560, Math.min(1100, ((max - min) / D) * 6)) + 20;
  const span = max - min;
  const x = (d) => LEFT + ((d - min) / span) * (W - LEFT - 20);
  const H = TOP + rows.length * (RW + 12) + 16;

  let months = '';
  for (let d = new Date(min); d < max; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    months += `<line x1="${x(d)}" y1="${TOP - 8}" x2="${x(d)}" y2="${H - 10}" stroke="var(--grid)"/>` +
      `<text x="${x(d) + 4}" y="${TOP - 12}">${MESES[d.getMonth()]}/${String(d.getFullYear()).slice(2)}</text>`;
  }

  const bars = rows.map((t, i) => {
    const yPos = TOP + i * (RW + 12);
    const s = x(starts[i]);
    const end = ends[i];
    const color = statusColor(t.status).replace('var(--muted)', 'var(--baseline)');
    const p = progress(t);
    const label = `<text class="rowlabel" x="0" y="${yPos + 13}" style="cursor:pointer" data-open="${t.id}">${esc(t.title.length > 26 ? t.title.slice(0, 25) + '…' : t.title)}</text>` +
      `<text class="rowsub" x="0" y="${yPos + 25}">${t.status}${p.total ? ` · ${p.done}/${p.total}` : ''}</text>`;
    if (end) {
      const e = Math.max(x(end), s + 8);
      const monthOnly = !t.prazo.date;
      return label +
        `<rect x="${s}" y="${yPos + 4}" width="${e - s}" height="${RW - 8}" rx="4" fill="${color}" ${monthOnly ? 'opacity="0.45"' : 'opacity="0.9"'}>
           <title>${esc(t.title)}</title>
         </rect>` +
        (p.total ? `<rect x="${s}" y="${yPos + 4}" width="${(e - s) * p.pct / 100}" height="${RW - 8}" rx="4" fill="${color}"/>` : '');
    }
    const e = x(today);
    return label +
      `<rect x="${s}" y="${yPos + 4}" width="${Math.max(e - s, 8)}" height="${RW - 8}" rx="4" fill="${color}" opacity="0.9"><title>${esc(t.title)} — sem prazo definido</title></rect>` +
      `<line x1="${e + 2}" y1="${yPos + RW / 2}" x2="${e + 40}" y2="${yPos + RW / 2}" stroke="${color}" stroke-width="2" stroke-dasharray="3 4"/>`;
  }).join('');

  return `<div class="gantt-card">
    <p class="gantt-note">Barra sólida = prazo definido · translúcida = prazo só de mês · tracejada = sem prazo (em aberto). Clique no nome pra abrir os detalhes.</p>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      ${months}
      <line x1="${x(today)}" y1="${TOP - 8}" x2="${x(today)}" y2="${H - 10}" stroke="var(--red)" stroke-width="1.5"/>
      <text x="${x(today) + 4}" y="${H - 2}" fill="var(--red)">hoje</text>
      ${bars}
    </svg>
  </div>`;
}

function bindGanttClicks(root) {

}

function renderGantt(main) {
  main.innerHTML = ganttHTML(visible());

/* ================= 🗂 Projetos (plataforma) ================= */
const projChildren = (id) => PROJECTS.filter((p) => p.parent_id === (id ?? null));
function projSubtreeIds(id) {
  const out = [id];
  for (const c of projChildren(id)) out.push(...projSubtreeIds(c.id));
  return out;
}
const projTasks = (id) => {
  const ids = new Set(projSubtreeIds(id));
  return TASKS.filter((t) => ids.has(t.project_id) && !t.archived);
};
function projStats(id) {
  const ts = projTasks(id);
  const closed = (t) => ['concluído', 'mesclado'].includes(t.status);
  const today = todayISO();
  const done = ts.filter(closed).length;
  const late = ts.filter((t) => t.prazo.date && t.prazo.date < today && !closed(t)).length;
  const next = ts.filter((t) => t.prazo.date && t.prazo.date >= today && !closed(t)).map((t) => t.prazo.date).sort()[0] || null;
  return { total: ts.length, done, late, next, pct: ts.length ? Math.round((done * 100) / ts.length) : 0 };
}
const PJ_STATUS = { ativo: 'var(--blue)', pausado: 'var(--yellow)', concluido: 'var(--good)' };

function pjCardHTML(p) {
  const st = projStats(p.id);
  const kids = projChildren(p.id).length;
  return `<div class="pj-card" data-pj="${p.id}">
    <div class="pj-top"><h3>${esc(p.name)}</h3><span class="pj-badge" style="background:${PJ_STATUS[p.status] || 'var(--muted)'}">${p.status}</span></div>
    <div class="sub">${p.empresa ? `<span class="tagchip">${esc(p.empresa)}</span>` : ''}${p.prazo_date ? `<span class="prazo-chip">⏱ ${fmtDate(p.prazo_date)}</span>` : ''}</div>

    <div class="sub" style="color:var(--muted)">${st.done}/${st.total} tarefas${st.late ? ` · <b style="color:var(--red)">${st.late} atrasada(s)</b>` : ''}${kids ? ` · ${kids} subprojeto(s)` : ''}</div>
  </div>`;
}

/* ================= modal ================= */
function openModal(slug) {
  MODAL_SLUG = slug ?? '';
  renderModal(MODAL_SLUG);
  $('#overlay').classList.add('open');
}
function closeModal() {
  MODAL_SLUG = null;
  $('#overlay').classList.remove('open');
}

function projSelOptions(cur) {
  const opts = ['<option value="">(nenhum)</option>'];
  const walk = (parent, depth) => {
    for (const p of projChildren(parent).sort((a, b) => a.name.localeCompare(b.name, 'pt'))) {
      opts.push(`<option value="${p.id}" ${cur === p.id ? 'selected' : ''}>${'  '.repeat(depth)}${depth ? '└ ' : ''}${esc(p.name)}</option>`);
      walk(p.id, depth + 1);
    }
  };
  walk(null, 0);
  return opts.join('');
}

/* ================= visualizador de anexos ================= */
async function openViewer(att) {
  const v = $('#viewer'), body = $('#v-body');
  $('#v-name').textContent = att.filename;
  body.innerHTML = '<div id="v-loading">carregando…</div>';
  v.classList.add('open');

  $('#v-dl').onclick = async () => {
    const d = await api(`/api/file?id=${att.id}&dl=1`);
    window.open(d.url, '_blank');
  };

  try {
    const r = await api(`/api/file?id=${att.id}`);
    const m = att.mime || '';
    if (m.startsWith('image/')) {
      body.innerHTML = `<img src="${r.url}" alt="${esc(att.filename)}">`;
    } else if (m === 'application/pdf') {
      body.innerHTML = `<iframe src="${r.url}" title="${esc(att.filename)}"></iframe>`;
    } else if (m.startsWith('video/')) {
      body.innerHTML = `<video controls autoplay src="${r.url}"></video>`;
    } else if (m.startsWith('audio/')) {
      body.innerHTML = `<audio controls autoplay src="${r.url}" style="width:min(480px,90%)"></audio>`;
    } else if (m.startsWith('text/') || ['application/json', 'application/xml', 'application/javascript'].includes(m)) {
      const txt = await (await fetch(r.url)).text();
      body.innerHTML = `<pre>${esc(txt.slice(0, 200000))}${txt.length > 200000 ? '\n… (truncado)' : ''}</pre>`;
    } else {
      body.innerHTML = `<div class="v-fallback">Sem visualização para este tipo de arquivo<br><span style="opacity:.7">(${esc(m || 'desconhecido')})</span><br><br>Use o botão <b>baixar</b> aí em cima ☝️</div>`;
    }
  } catch (e) {
    body.innerHTML = `<div class="v-fallback">Erro ao carregar o arquivo.</div>`;
  }
}
function closeViewer() { $('#viewer').classList.remove('open'); $('#v-body').innerHTML = ''; }
$('#v-close').onclick = closeViewer;
$('#viewer').addEventListener('click', (e) => { if (e.target.id === 'viewer' || e.target.id === 'v-body') closeViewer(); });

/* ================= aba hoje ================= */
const HOME = { weather: null, dollar: null, news: null, ts: 0, loading: false };
const HOME_TTL = 15 * 60 * 1000; // clima/dólar/notícias renovam a cada 15 min
const WMO = { 0: '☀️ céu limpo', 1: '🌤 quase limpo', 2: '⛅ parc. nublado', 3: '☁️ nublado', 45: '🌫 névoa', 48: '🌫 névoa', 51: '🌦 garoa', 53: '🌦 garoa', 55: '🌦 garoa', 61: '🌧 chuva fraca', 63: '🌧 chuva', 65: '🌧 chuva forte', 66: '🌧 chuva gelada', 67: '🌧 chuva gelada', 80: '🌦 pancadas', 81: '🌧 pancadas', 82: '⛈ pancadas fortes', 95: '⛈ tempestade', 96: '⛈ tempestade', 99: '⛈ tempestade' };

const meteoURL = (lat, lon) => `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=1`;

// posição atual do navegador (se o Felipe permitir); null se negado/indisponível
function getPosition() {
  return new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      (p) => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => res(null),
      { timeout: 6000, maximumAge: 15 * 60 * 1000 },
    );
  });
}

async function loadHere() {
  const pos = await getPosition();
  if (!pos) return null;
  const [w, g] = await Promise.allSettled([
    fetch(meteoURL(pos.lat.toFixed(3), pos.lon.toFixed(3))).then((r) => r.json()),
    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.lat}&longitude=${pos.lon}&localityLanguage=pt`).then((r) => r.json()),
  ]);
  if (w.status !== 'fulfilled') return null;
  const name = g.status === 'fulfilled' ? (g.value.city || g.value.locality || 'onde você está') : 'onde você está';
  return { name, data: w.value };
}

async function loadHome(force = false) {
  if (HOME.loading || (!force && HOME.ts && Date.now() - HOME.ts < HOME_TTL)) return false;
  HOME.loading = true;
  const [w, h, d, n] = await Promise.allSettled([
    fetch(meteoURL('-20.3155', '-40.3128')).then((r) => r.json()),
    loadHere(),
    fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL').then((r) => r.json()),
    api('/api/home/news'),
  ]);
  HOME.weather = w.status === 'fulfilled' ? w.value : null;
  HOME.here = h.status === 'fulfilled' ? h.value : null;
  HOME.dollar = d.status === 'fulfilled' ? (d.value.USDBRL || null) : null;
  HOME.news = n.status === 'fulfilled' ? n.value : null;
  HOME.ts = Date.now();
  HOME.loading = false;
  return true;
}

// compromissos de hoje: prazos (hoje/atrasados) + alertas de hoje, dos projetos
function homeAgenda() {
  const today = todayISO();
  const items = [];
  for (const t of TASKS.filter((x) => !x.archived)) {
    const closed = ['concluído', 'mesclado'].includes(t.status);
    if (t.prazo.date && !closed && t.prazo.date <= today) {
      items.push({ when: t.prazo.date < today ? 'atrasado' : 'hoje', late: t.prazo.date < today, title: t.title, slug: t.id });
    }
    for (const a of (t.alerts || [])) {
      if (!a.fired && String(a.fire_at).slice(0, 10) === today) {
        items.push({ when: new Date(a.fire_at).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' }), late: false, title: `🔔 ${a.message}`, slug: t.id });
      }
    }
  }
  return items.sort((a, b) => (a.late === b.late ? 0 : a.late ? -1 : 1));
}

function locHTML(label, data, extra = '') {
  const cur = data?.current, day = data?.daily;
  if (!cur) return '';
  const desc = WMO[cur.weather_code] || '—';
  const det = day ? ` <span class="h-sub">máx ${Math.round(day.temperature_2m_max?.[0] ?? 0)}° · mín ${Math.round(day.temperature_2m_min?.[0] ?? 0)}° · 🌧 ${day.precipitation_probability_max?.[0] ?? '–'}%</span>` : '';
  return `<div class="h-loc"><b>${Math.round(cur.temperature_2m)}°</b> ${desc} · ${esc(label)}${extra}${det}</div>`;
}

function homeHTML() {
  const hoje = new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo', weekday: 'long', day: 'numeric', month: 'long' });

/* ================= aba e-mail ================= */
let EMAIL_DATA = null;      // cache da última resposta (evita piscar no refresh)
let EMAIL_BUSY = false;     // checagem em andamento
let EMAIL_CHECK_OUT = '';   // resultado da última checagem (sobrevive ao redraw)

const IMP = [
  { key: 'agora',   label: '🔴 Agora (ação sua)' },
  { key: 'atencao', label: '🟡 Atenção' },
  { key: 'info',    label: 'ℹ️ Outros triados' },
];

const EMAIL_PENDING = new Map(); // spark_id -> acao escolhida (aplica em lote no worker)
const EM_ACTS = [
  { act: 'markAsSeen', label: '✓ lido' },
  { act: 'archive', label: '📥 arquivar' },
  { act: 'markAsSpam', label: '🚫 spam' },
  { act: 'moveToTrash', label: '🗑 lixo' },
];

function emItemHTML(m) {
  const from = m.from_name || m.from_addr || '?';
  const when = m.email_date ? fmtDateTime(m.email_date) : '';
  const pend = m.spark_id ? EMAIL_PENDING.get(m.spark_id) : null;
  const acts = m.spark_id ? `<div class="em-acts">${pend
    ? `<span class="em-pend">${esc(EM_ACTS.find((a) => a.act === pend)?.label || pend)} pendente</span><button class="btn small em-act" data-id="${m.spark_id}" data-act="">desfazer</button>`
    : EM_ACTS.map((a) => `<button class="btn small em-act" data-id="${m.spark_id}" data-act="${a.act}">${a.label}</button>`).join('')
  }</div>` : '';
  const subj = esc(m.subject || '(sem assunto)');
  return `<div class="em-item ${esc(m.importance)} ${pend ? 'pend' : ''}">
    <span class="em-sub">${m.spark_id ? `<a href="#" class="em-open" data-id="${m.spark_id}" title="ler aqui no painel">${subj}</a>` : subj}${m.unread === false ? ' <span class="em-meta">· lido</span>' : ''}</span>
    <span class="em-meta">${esc(from)}${m.account ? ' · ' + esc(m.account) : ''}${when ? ' · ' + when : ''}</span>
    ${m.summary ? `<span class="em-sum">${esc(m.summary)}</span>` : ''}
    ${m.spark_link ? `<a href="${esc(m.spark_link)}" target="_blank" rel="noopener">Abrir no Spark ↗</a>` : ''}
    ${acts}
  </div>`;
}

function emailHTML(d) {
  const w = d.worker || {};
  const seen = w.last_seen_at ? fmtDateTime(w.last_seen_at) : 'nunca';
  const run = d.last_run;
  const runTxt = run ? `${fmtDateTime(run.finished_at || run.started_at)} (${(run.stats && run.stats.items) ?? 0} itens)` : 'nenhuma ainda';
  const groups = IMP.map(({ key, label }) => {
    const items = (d.emails || []).filter((m) => m.importance === key);
    if (!items.length) return '';
    return `<div class="em-group"><h3>${label}</h3>${items.map(emItemHTML).join('')}</div>`;
  }).join('');
  const routines = (d.routines || []).map((r) => `
    <div class="em-routine" data-routine="${esc(r.name)}">
      <b>${esc(r.name)}</b>
      <input type="text" class="em-times" value="${esc((r.times || []).join(', '))}" title="horários HH:MM separados por vírgula (hora de SP)">
      <label class="toggle"><input type="checkbox" class="em-enabled" ${r.enabled ? 'checked' : ''}> ativa</label>
      <button class="btn small em-save-routine">salvar</button>
      <span class="em-note">última: ${r.last_run_at ? fmtDateTime(r.last_run_at) : 'nunca'}</span>
    </div>`).join('');
  return `<div class="em-wrap">
    <div class="em-status">
      <span><span class="em-dot ${w.online ? 'on' : 'off'}"></span>worker do Mac: <b>${w.online ? 'online' : 'offline'}</b> (visto ${seen})</span>
      <span>última triagem: <b>${runTxt}</b></span>
      ${d.jobs_na_fila ? `<span>na fila: <b>${d.jobs_na_fila}</b></span>` : ''}
    </div>
    <div class="em-actions">
      <button class="btn primary" id="em-check" ${w.online ? '' : 'disabled title="worker offline"'}>📥 Checar caixa agora</button>
      <button class="btn" id="em-triage" ${w.online ? '' : 'disabled title="worker offline"'}>🧹 Triagem completa agora</button>
      ${EMAIL_PENDING.size ? `<button class="btn primary" id="em-apply" ${w.online ? '' : 'disabled title="worker offline"'}>✔ Aplicar ${EMAIL_PENDING.size} ação(ões) no Spark</button>` : ''}
      <span class="em-note" id="em-msg"></span>
    </div>
    <div id="em-checkout">${EMAIL_CHECK_OUT ? `<div class="em-out">${EMAIL_CHECK_OUT}</div>` : ''}</div>
    ${routines ? `<div class="em-group"><h3>Rotinas</h3>${routines}</div>` : ''}
    ${groups || '<div class="empty">Nenhum e-mail triado ainda — roda uma triagem pra popular esta aba.</div>'}
  </div>`;
}

// transforma URLs em links clicáveis (resultado do check vem como texto puro)
function linkify(s) {
  return esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

async function renderEmail(main) {

  else main.innerHTML = '<div class="empty">Carregando e-mail…</div>';
  try { EMAIL_DATA = await api('/api/email/summary'); } catch { return; }

/* pop-up de leitura: busca a thread via worker (spark thread) e mostra no painel */
const EM_THREADS = new Map(); // spark_id -> html do corpo (cache da sessão)

async function openEmailView(id) {
  const m = (EMAIL_DATA?.emails || []).find((x) => x.spark_id === id);
  $('#em-view-title').textContent = m?.subject || 'E-mail';
  const sparkA = $('#em-view-spark');
  if (m?.spark_link) { sparkA.href = m.spark_link; sparkA.style.display = ''; } else sparkA.style.display = 'none';
  $('#em-view').classList.add('open');
  if (EM_THREADS.has(id)) { $('#em-view-body').innerHTML = EM_THREADS.get(id); return; }
  $('#em-view-body').innerHTML = '<span class="em-note">buscando no Spark do Mac… (~10s)</span>';
  try {
    const { id: jid } = await post('/api/email/enqueue', { kind: 'thread', params: { id } });
    for (let i = 0; i < 30; i++) {
      await new Promise((r) => setTimeout(r, 2500));
      const j = await api(`/api/email/job?id=${jid}`);
      if (j.status === 'done') { EM_THREADS.set(id, linkify(j.result || '(vazio)')); $('#em-view-body').innerHTML = EM_THREADS.get(id); return; }
      if (j.status === 'error') { $('#em-view-body').innerHTML = `<span class="em-note">erro: ${esc(j.error || '?')}</span>`; return; }
    }
    $('#em-view-body').innerHTML = '<span class="em-note">demorou demais — o worker deve estar ocupado; tenta de novo já já.</span>';
  } catch { $('#em-view-body').innerHTML = '<span class="em-note">erro ao buscar</span>'; }
}
const closeEmailView = () => $('#em-view').classList.remove('open');

function bindEmail(main) {
  main.querySelectorAll('.em-open').forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    openEmailView(Number(a.dataset.id));
  }));
  const btnCheck = $('#em-check', main);
  if (btnCheck) btnCheck.onclick = async () => {
    if (EMAIL_BUSY) return;
    EMAIL_BUSY = true;
    $('#em-msg').textContent = 'checando a caixa… (~30s)';
    try {
      const { id } = await post('/api/email/enqueue', { kind: 'check_now' });
      for (let i = 0; i < 30; i++) {
        await new Promise((r) => setTimeout(r, 3000));
        const job = await api(`/api/email/job?id=${id}`);
        if (job.status === 'done') { EMAIL_CHECK_OUT = linkify(job.result || ''); $('#em-checkout').innerHTML = `<div class="em-out">${EMAIL_CHECK_OUT}</div>`; $('#em-msg').textContent = ''; break; }
        if (job.status === 'error') { $('#em-msg').textContent = 'erro: ' + (job.error || '?'); break; }
        if (i === 29) $('#em-msg').textContent = 'demorando… o worker deve estar ocupado; tenta de novo já já.';
      }
    } catch (e) { $('#em-msg').textContent = 'erro ao enfileirar'; }
    EMAIL_BUSY = false;
  };
  const btnTriage = $('#em-triage', main);
  if (btnTriage) btnTriage.onclick = async () => {
    if (!confirm('Rodar a triagem completa agora? Demora alguns minutos; o relatório chega no Telegram.')) return;
    await post('/api/email/enqueue', { kind: 'triage', notify: true });
    $('#em-msg').textContent = 'triagem enfileirada — relatório chega no Telegram 📬';
  };
  // marcar/desmarcar ações pendentes nos e-mails
  main.querySelectorAll('.em-act').forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.id);
    if (b.dataset.act) EMAIL_PENDING.set(id, b.dataset.act);
    else EMAIL_PENDING.delete(id);
    main.innerHTML = emailHTML(EMAIL_DATA);
    bindEmail(main);
  });
  const btnApply = $('#em-apply', main);
  if (btnApply) btnApply.onclick = async () => {
    if (EMAIL_BUSY || !EMAIL_PENDING.size) return;
    EMAIL_BUSY = true;
    $('#em-msg').textContent = 'aplicando no Spark…';
    try {
      // agrupa por ação -> um job por ação
      const groups = {};
      for (const [id, act] of EMAIL_PENDING) (groups[act] ||= []).push(id);
      const jobs = [];
      for (const [act, ids] of Object.entries(groups)) {
        const { id } = await post('/api/email/enqueue', { kind: 'action', params: { action: act, ids } });
        jobs.push(id);
      }
      for (let i = 0; i < 40 && jobs.length; i++) {
        await new Promise((r) => setTimeout(r, 2500));
        for (const jid of [...jobs]) {
          const j = await api(`/api/email/job?id=${jid}`);
          if (j.status === 'done') jobs.splice(jobs.indexOf(jid), 1);
          if (j.status === 'error') { $('#em-msg').textContent = 'erro: ' + (j.error || '?'); jobs.splice(jobs.indexOf(jid), 1); }
        }
      }
      EMAIL_PENDING.clear();
      $('#em-msg').textContent = 'aplicado ✓';
    } catch (e) { $('#em-msg').textContent = 'erro ao aplicar'; }
    EMAIL_BUSY = false;
    EMAIL_DATA = await api('/api/email/summary').catch(() => EMAIL_DATA);
    if (TAB === 'email') { main.innerHTML = emailHTML(EMAIL_DATA); bindEmail(main); }
  };
  main.querySelectorAll('.em-save-routine').forEach((b) => b.onclick = async () => {
    const row = b.closest('.em-routine');
    const times = row.querySelector('.em-times').value.split(',').map((t) => t.trim()).filter(Boolean);
    if (times.some((t) => !/^\d{2}:\d{2}$/.test(t))) { alert('horários no formato HH:MM, separados por vírgula'); return; }
    await post('/api/email/routine', { name: row.dataset.routine, times, enabled: row.querySelector('.em-enabled').checked });
    b.textContent = 'salvo ✓'; setTimeout(() => (b.textContent = 'salvar'), 1500);
  });
}

const AGENT = 'https://iucqufccyboilasswnun.supabase.co/functions/v1/telegram';
let CHAT_OPEN = false;
let CHAT_BUSY = false;

function bubbleHTML(m) {
  const when = new Date(m.created_at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  return `<div class="bubble ${m.role}">${esc(m.content)}<span class="when">${when}</span></div>`;
}

async function loadChat({ keepScroll = false } = {}) {
  const msgs = await api('/api/chat/history');
  const box = $('#c-msgs');
  const atBottom = !keepScroll || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = msgs.map(bubbleHTML).join('') || '<div class="muted-note">Sem mensagens ainda — diz um oi 👋</div>';
  if (atBottom) box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  const ta = $('#c-text');
  const text = ta.value.trim();
  if (!text || CHAT_BUSY) return;
  CHAT_BUSY = true;
  ta.value = '';
  const box = $('#c-msgs');
  box.insertAdjacentHTML('beforeend', bubbleHTML({ role: 'user', content: text, created_at: new Date().toISOString() }));
  box.scrollTop = box.scrollHeight;
  $('#c-typing').classList.add('on');
  try {
    const res = await fetch(`${AGENT}?chat=1`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ text }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'erro');
    box.insertAdjacentHTML('beforeend', bubbleHTML({ role: 'assistant', content: body.reply, created_at: new Date().toISOString() }));
    box.scrollTop = box.scrollHeight;
    load(); // o agente pode ter mexido nas tarefas
  } catch (e) {
    box.insertAdjacentHTML('beforeend', bubbleHTML({ role: 'assistant', content: '⚠️ Erro ao falar com o gerente. Tenta de novo?', created_at: new Date().toISOString() }));
  } finally {
    $('#c-typing').classList.remove('on');
    CHAT_BUSY = false;
    ta.focus();
  }
}

$('#btn-chat').onclick = () => {
  CHAT_OPEN = !CHAT_OPEN;
  $('#chat').classList.toggle('open', CHAT_OPEN);
  if (CHAT_OPEN) { loadChat(); $('#c-text').focus(); }
};
$('#c-close').onclick = () => { CHAT_OPEN = false; $('#chat').classList.remove('open'); };
$('#c-send').onclick = sendChat;
$('#c-text').addEventListener('keydown', (e) => {

      const c = document.createElement('canvas');
      c.width = c.height = 96;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 96, 96);
      const data = c.toDataURL('image/jpeg', 0.82);
      await post('/api/user/avatar', { data });
      if (ME) { ME.avatar = data; localStorage.setItem('iago_user', JSON.stringify(ME)); }
      $('#my-av').innerHTML = `<img class="avatar me" src="${data}">`;
      load();
    };
    img.src = URL.createObjectURL(f);
  };
  $('#av-del').onclick = async () => {
    await post('/api/user/avatar', { data: '' });
    if (ME) { ME.avatar = ''; localStorage.setItem('iago_user', JSON.stringify(ME)); }
    $('#my-av').innerHTML = `<span class="avatar me">${esc((ME?.name || '?').slice(0, 1).toUpperCase())}</span>`;
    load();
  };
  $('#pw-save').onclick = async () => {
    const current = $('#pw-cur').value, password = $('#pw-new').value;
    if (!current || password.length < 6) { alert('preencha a senha atual e uma nova com pelo menos 6 caracteres'); return; }
    await post('/api/auth/password', { current, password });
    alert('senha trocada ✓');
    $('#pw-cur').value = ''; $('#pw-new').value = '';
  };
  if (!adm) return;

  const paint = (users) => {
    $('#set-users').innerHTML = users.map((u) => `
      <div class="set-user ${u.active ? '' : 'off'}">
        <b>${esc(u.name || u.username)}</b>
        <span class="dim">@${esc(u.username)} · ${u.role}</span>
        <span class="dim">${u.telegram_linked ? '📱 Telegram ✓' : (u.link_code ? `código do bot: <code>${esc(u.link_code)}</code>` : 'sem código')}</span>
        <span class="spacer" style="flex:1"></span>
        <button class="btn small" data-supass="${u.id}">nova senha</button>
        <button class="btn small" data-sucode="${u.id}">novo código</button>
        ${u.id === ME?.id ? '' : `<button class="btn small" data-sutoggle="${u.id}" data-on="${u.active}">${u.active ? 'desativar' : 'reativar'}</button>`}
      </div>`).join('') || '<span class="dim">nenhum usuário</span>';
    document.querySelectorAll('[data-supass]').forEach((b) => b.onclick = async () => {
      const p = prompt('Nova senha para este usuário (mín. 6):');
      if (!p || p.length < 6) return;
      await post('/api/user/update', { id: Number(b.dataset.supass), password: p });
      alert('senha definida ✓ (avise a pessoa)');
    });
    document.querySelectorAll('[data-sucode]').forEach((b) => b.onclick = async () => {
      await post('/api/user/update', { id: Number(b.dataset.sucode), new_link_code: true, unlink_telegram: true });
      refresh();
    });
    document.querySelectorAll('[data-sutoggle]').forEach((b) => b.onclick = async () => {
      await post('/api/user/update', { id: Number(b.dataset.sutoggle), active: b.dataset.on !== 'true' });
      refresh();
    });
  };
  const refresh = () => api('/api/users').then(paint).catch(() => {});
  refresh();
  $('#nu-add').onclick = async () => {
    const name = $('#nu-name').value.trim(), username = $('#nu-user').value.trim(), password = $('#nu-pass').value;
    if (!username || password.length < 6) { alert('preencha username e senha (mín. 6)'); return; }
    await post('/api/user/create', { name, username, password });
    $('#nu-name').value = $('#nu-user').value = $('#nu-pass').value = '';
    refresh();
  };
}
$('#btn-cfg').onclick = renderSettings;

/* ================= boot ================= */
async function boot() {
  if (!TOKEN && !KEY) { showLogin(); return; }
  try {
    const me = await api('/api/auth/me');
    ME = { ...(ME || {}), ...me.user }; // preserva avatar salvo localmente
    localStorage.setItem('iago_user', JSON.stringify(ME));
  } catch { return; } // 401 já abriu o login
  applyRole();
  load();
}
boot();
setInterval(() => {
  if (!ME && !KEY) return; // sem sessão, sem refresh
  if (!MODAL_SLUG && !CHAT_BUSY && !$('#overlay').classList.contains('open')) load();
  if (CHAT_OPEN && !CHAT_BUSY) loadChat({ keepScroll: true }); // pega mensagens vindas do Telegram/briefings
}, 20000);
</script>
